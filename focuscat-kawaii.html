<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FocusCat — Kawaii</title>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f2; --card:#ffffff; --ink:#5a5254; --dim:#a89fa2; --line-ui:#eee7de;
    --accent:#f4a259;
    --outline:#4a4045;      /* thin, consistent, warm dark */
    --face:#4a4045;         /* eye/mouth color (light on the dark cat) */
    --coat:#ffffff; --belly:#ffffff; --innerear:#f3b8c0; --whisker:#4a404573;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);font-family:'Varela Round',sans-serif;color:var(--ink);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:16px;padding:26px 16px 60px}
  h1{font-size:22px}
  h1 span{color:var(--accent)}
  .bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;
    background:var(--card);border:1.5px solid var(--line-ui);border-radius:999px;padding:8px 12px}
  .chip{border:none;background:transparent;color:var(--dim);border-radius:999px;
    padding:8px 14px;font-family:inherit;font-size:13.5px;cursor:pointer;transition:.15s}
  .chip[aria-pressed="true"]{background:var(--accent);color:#fff}
  .sep{width:1.5px;height:20px;background:var(--line-ui)}
  .swb{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--line-ui);cursor:pointer;padding:0;transition:.12s;position:relative;overflow:hidden}
  .swb[aria-pressed="true"]{border-color:var(--outline);transform:scale(1.12)}
  .swb i{position:absolute;inset:0}
  .glasslbl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim);cursor:pointer;padding:0 6px}
  .glasslbl input{accent-color:var(--accent);width:15px;height:15px}
  #stage{position:relative;width:min(880px,96vw);aspect-ratio:9/6;background:var(--card);
    border:1.5px solid var(--line-ui);border-radius:26px;overflow:hidden;
    box-shadow:0 20px 50px #d8c9b433}
  #speech{position:absolute;background:#fff;border:2.5px solid var(--outline);color:var(--outline);
    border-radius:14px;padding:5px 12px;font-size:14px;opacity:0;transition:opacity .2s;
    transform:translate(-50%,-100%);white-space:nowrap}
  #speech.show{opacity:1}
  #speech::after{content:"";position:absolute;top:100%;left:50%;margin-left:-6px;
    border:6px solid transparent;border-top-color:var(--outline)}
  .hint{color:var(--dim);font-size:13px}

  /* ---------- gentle motion ---------- */
  .breathe{animation:br 3.8s ease-in-out infinite;transform-origin:460px 430px}
  @keyframes br{0%,100%{transform:translateY(0)}50%{transform:translateY(2.5px)}}
  .tail{animation:tl 4.2s ease-in-out infinite;transform-origin:588px 430px}
  @keyframes tl{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(6deg)}}
  .earL{animation:fl 8.5s ease-in-out infinite;transform-origin:392px 218px}
  @keyframes fl{0%,91%,100%{transform:rotate(0)}93%{transform:rotate(-8deg)}96%{transform:rotate(2deg)}}
  #head{transform-origin:460px 360px;transform:rotate(3deg);transition:transform .8s cubic-bezier(.35,1.3,.4,1)}
  #stage.look-laptop #head{transform:rotate(-4deg) translateY(-4px)}
  #stage.stare #head{transform:rotate(-1deg) translateY(-7px)}
  /* reading = happy closed-arc eyes; glance/stare = tiny oval eyes */
  .eyesOpen{opacity:0;transform-box:fill-box;transform-origin:50% 50%;
    transition:opacity .18s, transform .5s cubic-bezier(.35,1.3,.4,1)}
  .eyesClosed{opacity:1;transition:opacity .18s}
  #stage.look-laptop .eyesOpen,#stage.stare .eyesOpen{opacity:1}
  #stage.look-laptop .eyesClosed,#stage.stare .eyesClosed{opacity:0}
  #stage.look-laptop .eyesOpen{transform:translate(-7px,-2px)}
  /* cute frown: soft squint + little worried-annoyed brows, not wide-eyed */
  #stage.stare .eyesOpen{transform:scaleY(.68) translateY(2px)}
  .browsS{opacity:0;transition:opacity .25s}
  #stage.stare .browsS{opacity:1}
  #stage.stare .earL{transform:rotate(-10deg)}
  #stage.stare .earR{transform:rotate(10deg)}
  .earR{transition:transform .35s;transform-origin:528px 218px}
  .steam path{stroke-dasharray:4 10;animation:sf 3.4s linear infinite;opacity:.55}
  .steam path:nth-child(2){animation-delay:-1.2s}
  .steam path:nth-child(3){animation-delay:-2.3s}
  @keyframes sf{from{stroke-dashoffset:56;transform:translateY(0)}to{stroke-dashoffset:0;transform:translateY(-9px)}}

  /* walker: tiny waddle */
  #walker{position:absolute;left:0;top:0;width:200px;height:225px;will-change:transform;transform-origin:top left;opacity:0}
  .rock{animation:rock .55s ease-in-out infinite;transform-origin:100px 180px}
  @keyframes rock{0%,100%{transform:rotate(2deg)}50%{transform:rotate(-2deg)}}
  .pawL{animation:step .55s ease-in-out infinite}
  .pawR{animation:step .55s ease-in-out infinite;animation-delay:-.275s}
  @keyframes step{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .headbob{animation:hb .55s ease-in-out infinite;transform-origin:100px 110px}
  @keyframes hb{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-2.5px) rotate(1deg)}}
  .wtail{animation:wt .9s ease-in-out infinite;transform-origin:168px 158px}
  @keyframes wt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
  #walker .mouthOpen{opacity:0}
  #walker.meow .mouthOpen{opacity:1}
  #walker.meow .mouthClosed{opacity:0}
  #walker.meow{animation:sq .3s ease-out}
  @keyframes sq{0%{scale:1 1}40%{scale:1.05 .95}100%{scale:1 1}}
  .patch{display:none}
  .show-mikan .patch-mikan{display:block}
  .show-kuro .patch-kuro{display:block}
  .show-latte .patch-latte{display:block}
  .glassesOff .glasses{display:none}
  @media (prefers-reduced-motion:reduce){
    .breathe,.tail,.earL,.steam path,.rock,.pawL,.pawR,.headbob,.wtail{animation:none}
  }
</style>
</head>

<div class="hint">tiny eyes. tiny body. maximum judgment. toggle the glasses if your cat is feeling scholarly.</div>

<script>
/* ---------- cats: full solid coats, same face everywhere ---------- */
const CATS={
  mikan:{coat:'#f4a259',face:'#4a4045',innerear:'#f8c3b4',whisker:'#4a404573',pitch:1.1},   /* orange */
  kuro:{coat:'#3d3741',face:'#f6f2ec',innerear:'#bb8f9c',whisker:'#f6f2ecd9',pitch:.78},    /* black  */
  latte:{coat:'#ffffff',face:'#4a4045',innerear:'#f3b8c0',whisker:'#4a404573',pitch:1},     /* white  */
};
let cat='mikan';
const stage=document.getElementById('stage');
function applyCat(){
  const c=CATS[cat],r=document.documentElement.style;
  r.setProperty('--coat',c.coat);r.setProperty('--face',c.face);
  r.setProperty('--innerear',c.innerear);r.setProperty('--whisker',c.whisker);
}

/* ---------- tiny synth voice ---------- */
let actx=null;const A=()=>actx??=new (window.AudioContext||window.webkitAudioContext)();
function meow(i=1){
  const ctx=A(),t=ctx.currentTime,p=CATS[cat].pitch;
  const o=ctx.createOscillator();o.type='sawtooth';
  const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=1000;f.Q.value=3.4;
  const g=ctx.createGain();const b=(430+i*70)*p;
  o.frequency.setValueAtTime(b*.8,t);
  o.frequency.linearRampToValueAtTime(b*1.45,t+.12);
  o.frequency.linearRampToValueAtTime(b*.7,t+.48);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.26*i,t+.05);
  g.gain.linearRampToValueAtTime(0,t+.54);
  o.connect(f).connect(g).connect(ctx.destination);o.start(t);o.stop(t+.58);
}
function mrrp(){
  const ctx=A(),t=ctx.currentTime,p=CATS[cat].pitch;
  const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';
  o.frequency.setValueAtTime(300*p,t);o.frequency.linearRampToValueAtTime(560*p,t+.25);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.05);g.gain.linearRampToValueAtTime(0,t+.29);
  o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.31);
}

/* ---------- state ---------- */
const walker=document.getElementById('walker');
const speech=document.getElementById('speech');
const S={detected:'FOCUSED',since:null,mode:'study',t:0,target:0,lastMeow:0,back:false};
const LINES={sus:['mrrp?','...?'],mid:['meow.','the book.'],big:['MEOW!!','phone. down.','I walked ALL this way']};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function say(txt,x,y,ms=1500){
  speech.textContent=txt;speech.style.left=x+'px';speech.style.top=y+'px';
  speech.classList.add('show');clearTimeout(say.tm);
  say.tm=setTimeout(()=>speech.classList.remove('show'),ms);
}

/* reading -> peek at laptop every 10-15s -> back to book */
(function gaze(){
  setTimeout(()=>{
    if(S.mode==='study'){
      stage.classList.add('look-laptop');
      setTimeout(()=>{stage.classList.remove('look-laptop');gaze();},2600+Math.random()*1500);
    } else gaze();
  },10000+Math.random()*5000);
})();

/* feet-anchored approach: grows toward the viewer, stays in frame */
function pathPos(t){
  const R=stage.getBoundingClientRect();
  const s=.95+(3.2-.95)*t*t;
  const footX=R.width*.51+(R.width*.5-R.width*.51)*t;
  const footY=R.height*.81+(R.height*.97-R.height*.81)*Math.pow(t,1.2);
  const w=200*s,h=225*s;
  return {x:footX-w/2,y:Math.max(4,footY-h),s};
}
let prev=performance.now();
function tick(now){
  const dt=now-prev;prev=now;
  const distracted=S.detected!=='FOCUSED';
  if(distracted){
    S.since??=now;const d=now-S.since;
    if(S.mode==='study'&&d>900){S.mode='sus';stage.classList.add('stare');mrrp();
      say(pick(LINES.sus),stage.clientWidth*.51,stage.clientHeight*.3);}
    if(S.mode==='sus'&&d>4200){S.mode='walk';S.back=false;S.target=1;
      stage.classList.remove('stare');
      document.querySelector('#scene .breathe').style.opacity=0;
      document.querySelectorAll('#scene .tail').forEach(t=>t.style.opacity=0);
      walker.style.opacity=1;}
    if(S.mode==='walk'&&!S.back&&now-S.lastMeow>(S.t>.75?1500:2300)){
      S.lastMeow=now;
      walker.classList.remove('meow');void walker.offsetWidth;walker.classList.add('meow');
      meow(Math.min(1.4,.8+S.t*.7));
      const p=pathPos(S.t);
      say(pick(S.t>.75?LINES.big:LINES.mid),p.x+100*p.s,Math.max(26,p.y-6));
      setTimeout(()=>walker.classList.remove('meow'),320);
    }
  } else if(S.since!==null){
    S.since=null;
    if(S.mode==='sus'){S.mode='study';stage.classList.remove('stare');}
    else if(S.mode==='walk'){S.back=true;S.target=0;
      say('hmph.',stage.clientWidth*.5,stage.clientHeight*.3,1400);}
  }
  const dir=Math.sign(S.target-S.t);
  if(dir!==0){
    S.t+=dir*(S.back?.24:(S.t>.6?.3:.16))*(dt/1000);
    if(Math.sign(S.target-S.t)!==dir)S.t=S.target;
  }
  if(S.back&&S.t<=0){
    S.back=false;S.mode='study';
    walker.style.opacity=0;
    document.querySelector('#scene .breathe').style.opacity=1;
    document.querySelectorAll('#scene .tail').forEach(t=>t.style.opacity=1);
  }
  if(S.mode==='walk'||S.t>0){
    const p=pathPos(S.t);
    walker.style.transform=`translate(${p.x}px,${p.y}px) scale(${p.s})`;
  }
  requestAnimationFrame(tick);
}

document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true');S.detected=b.dataset.s;A();
}));
document.querySelectorAll('.swb').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.swb').forEach(x=>x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true');cat=b.dataset.cat;applyCat();mrrp();
}));
document.getElementById('glassBox').addEventListener('change',e=>{
  stage.classList.toggle('glassesOff',!e.target.checked);
});
applyCat();
requestAnimationFrame(tick);
</script>
